name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: go mod download

      - name: Verify Formatting
        run: go fmt ./...

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests with Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check Coverage Threshold
        # Example threshold configuration
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}' | awk '{if ($1 < 80.0) {print "Coverage is under 80%"; exit 1}}'
